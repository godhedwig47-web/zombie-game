<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFTERLIGHT — A Survival Story</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap');
:root{--bg:#101310;--panel:#171b17;--line:#30372f;--muted:#9da59a;--cream:#eee9dc;--lime:#c4ed75;--rust:#e18463;--blue:#89b7d7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#2c382c 0%,#171b17 45%,#101310 85%);color:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}.shell{max-width:1160px;margin:auto;padding:20px 24px 42px}
.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0 18px;margin-bottom:24px}.brand{font:700 23px Oswald;letter-spacing:3px}.brand span{color:var(--lime)}.brand small{display:block;color:var(--muted);font:10px 'DM Mono';letter-spacing:2px;margin-top:1px}.top-actions{display:flex;gap:10px}.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--muted);font-size:12px}.iconbtn:hover{border-color:var(--lime);color:var(--cream)}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px}.side{display:flex;flex-direction:column;gap:14px}.card{background:linear-gradient(145deg,#1a201a,#151915);border:1px solid var(--line);border-radius:12px;padding:18px}.survivor{padding:20px}.eyebrow{font:11px 'DM Mono';letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font:600 clamp(27px,4vw,42px) Oswald;text-transform:uppercase;letter-spacing:.5px;line-height:1.08;margin:9px 0 8px}h2{font:600 20px Oswald;text-transform:uppercase;margin-bottom:13px}h3{font:600 14px 'DM Sans';margin:0 0 12px}.name-line{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.name{font-size:18px;font-weight:700}.badge{font:10px 'DM Mono';padding:5px 7px;border:1px solid #414941;border-radius:99px;color:var(--lime);text-transform:uppercase}
.stat{margin:13px 0}.stat-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.stat-head b{font:12px 'DM Mono';font-weight:400;color:var(--cream)}.track{height:6px;background:#30372f;border-radius:9px;overflow:hidden}.fill{height:100%;border-radius:9px;transition:width .35s;background:var(--lime)}.fill.health{background:var(--rust)}.fill.energy{background:#e7bd6a}.fill.morale{background:#89b7d7}
.inventory{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:1px solid var(--line);background:#121612;border-radius:8px;padding:10px}.item span{display:block;font:10px 'DM Mono';color:var(--muted);text-transform:uppercase}.item b{display:block;margin-top:4px;font:15px 'DM Mono';color:var(--cream)}
.main{min-width:0}.hero{position:relative;overflow:hidden;min-height:190px;border-radius:13px;border:1px solid #3c4638;background:linear-gradient(105deg,rgba(16,19,16,.97),rgba(16,19,16,.72)),radial-gradient(ellipse at 80% 45%,#536342 0,#303c2a 28%,#191e18 58%);padding:24px 27px;margin-bottom:16px}.hero:after{content:'☣';position:absolute;font-size:180px;line-height:1;right:28px;top:4px;color:#c4ed75;opacity:.075}.hero>*{position:relative;z-index:1}.kicker{font:11px 'DM Mono';letter-spacing:2px;color:var(--lime)}.hero p{color:#c2c7bd;max-width:550px;line-height:1.65;margin:12px 0 0;font-size:14px}
.narrative{line-height:1.75;color:#d1d4cb;font-size:15px;margin:0 0 19px}.choices{display:grid;gap:9px}.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:10px;background:#181d18;transition:.17s}.choice:hover{transform:translateY(-1px);border-color:#81965d;background:#20271e}.choice:disabled{opacity:.45;cursor:not-allowed}.choice-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:8px;background:#283026;color:var(--lime);font-size:16px}.choice-copy{flex:1}.choice-copy b{display:block;font-size:14px;margin-bottom:4px}.choice-copy small{color:var(--muted);font-size:12px;line-height:1.45;display:block}.choice-arrow{color:#798276;font-size:19px}.log{margin-top:15px;max-height:150px;overflow:auto}.logline{border-top:1px solid #272d27;padding:8px 0;font-size:11px;color:var(--muted);line-height:1.4}.logline strong{color:#d6dbd0;font-weight:500}
.footer{display:flex;justify-content:space-between;align-items:center;color:#727b70;font:10px 'DM Mono';margin-top:18px}
.overlay{position:fixed;inset:0;z-index:10;background:rgba(8,10,8,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}.modal{width:min(520px,100%);background:#171c17;border:1px solid #3a4437;border-radius:15px;padding:30px;box-shadow:0 24px 100px #0009}.modal h1{font-size:40px}.modal p{color:#b9c0b5;line-height:1.65}.modal .intro{font-size:15px}.field{display:flex;flex-direction:column;gap:7px;margin:20px 0}.field label{font:10px 'DM Mono';letter-spacing:1px;color:var(--muted);text-transform:uppercase}.field input{background:#101410;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--cream);font:15px 'DM Sans';outline:none}.field input:focus{border-color:var(--lime)}
.primary{border:0;border-radius:8px;padding:12px 17px;background:var(--lime);color:#151a12;font-weight:700}.primary:hover{background:#d6f696}.quiet{border:1px solid var(--line);border-radius:8px;padding:12px 17px;background:none}.row{display:flex;gap:10px;flex-wrap:wrap}.endtag{display:inline-block;border:1px solid #58674a;color:var(--lime);padding:6px 9px;border-radius:5px;font:10px 'DM Mono';letter-spacing:1px;margin:4px 0 15px}
@media(max-width:760px){.shell{padding:14px 14px 30px}.layout{grid-template-columns:1fr;gap:14px}.side{display:grid;grid-template-columns:1fr 1fr;align-items:start}.survivor{grid-column:1/-1}.card{padding:15px}.hero{padding:21px;min-height:180px}.hero:after{right:0;font-size:140px}.topbar{margin-bottom:15px}}
@media(max-width:400px){.side{grid-template-columns:1fr}.survivor{grid-column:auto}.choice{padding:12px}.hero p{font-size:13px}}
</style>
</head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const defaults={day:1,name:'',health:76,energy:78,morale:62,hunger:28,water:24,ammo:3,food:2,meds:1,people:0,flags:{},log:[],ended:false,ending:''};
let g={...defaults};
const scenes={
start:{place:'YOUR NEIGHBORHOOD',title:'The world went quiet.',text:()=>`The emergency broadcast cut out sometime before dawn. From your apartment window, smoke rises beyond the river. Your phone has one message from ${g.name||'you'}’s sister: “I’m at the county clinic. Please come.” The streets are already changing.`,choices:[
['🏃','Go to the clinic','Find your sister. The roads will be dangerous.','clinic',{}],
['🏠','Secure the apartment','Board the doors and gather what you can.','shelter',{}],
['🚗','Leave the city','The highway may still be open. Your sister will have to wait.','highway',{}]]},
1:{place:'THE FIRST MORNING',title:'The world went quiet.',text:()=>`The emergency broadcast cut out sometime before dawn. From your apartment window, smoke rises beyond the river. Your phone has one message from ${g.name||'you'}’s sister: “I’m at the county clinic. Please come.” The streets are already changing.`,choices:[
['🏃','Go to the clinic','Find your sister. The roads will be dangerous.','clinic',{}],
['🏠','Secure the apartment','Board the doors and gather what you can.','shelter',{}],
['🚗','Leave the city','The highway may still be open. Your sister will have to wait.','highway',{}]]},
clinic:{place:'COUNTY CLINIC',title:'A long way through.',text:()=>`The clinic’s automatic doors are stuck half open. Something drags its feet in the lobby. A nurse crouches behind the reception desk, clutching a ring of keys.`,choices:[
['🗝','Help the nurse','Get her out. Two people have a better chance.','rescue',{}],
['🧱','Make a distraction','Draw the infected toward the ambulance bay.','distract',{}],
['🔫','Spend a round','Clear the lobby quickly.','shoot',{}]]},
shelter:{place:'YOUR APARTMENT',title:'The first night.',text:()=>`You wedge a table against the front door. The neighborhood is loud with sirens and breaking glass. You have a few hours before you need to move.`,choices:[
['🥫','Ration and rest','Recover your strength and make supplies last.','rest',{}],
['🔍','Search nearby apartments','Risk the halls for food and medicine.','scavenge',{}],
['📻','Check the radio','Listen for a safe zone or another survivor.','radio',{}]]},
highway:{place:'NORTHBOUND HIGHWAY',title:'The road out.',text:()=>`Cars are abandoned across all lanes. A family waves from an overturned bus. Beyond them, the road disappears into a wall of smoke.`,choices:[
['🤝','Help the family','Take a risk for people who need you.','family',{}],
['⛽','Search the cars','Look for fuel and supplies before moving on.','cars',{}],
['🌲','Cut through the woods','Avoid the highway and keep moving.','woods',{}]]},
camp:{place:'PINE RIDGE CAMP',title:'A fragile refuge.',text:()=>`You reach an old ranger station tucked into the hills. A handful of survivors have made a camp here. There is a radio mast, a garden, and a lot of nervous eyes.`,choices:[
['📡','Repair the radio mast','Call for help beyond the valley.','mast',{}],
['🌱','Work on the garden','Build food for the people here.','garden',{}],
['🧭','Scout the valley','Find a safer route and learn what’s nearby.','scout',{}]]},
clinic2:{place:'COUNTY CLINIC',title:'Someone is still here.',text:()=>`You spot a familiar blue coat near the pharmacy. Your sister made it this far. She is hurt, but alive.`,choices:[
['🩹','Treat her wound','Use your medicine and get her somewhere safe.','sister',{}],
['🚪','Get out now','The noise is drawing infected from every hall.','escape',{}]]},
};
const events={
rescue:()=>{g.people++;g.morale+=13;g.meds++;g.flags.nurse=true;g.log.unshift('The nurse, Mara, joins you. She found a packet of antibiotics.');return 'Mara grabs your hand. “There’s a service exit. I know the way.” Together you slip out with antibiotics and a new companion.'},
distract:()=>{g.energy-=14;g.health-=5;g.ammo++;return 'You bang on the ambulance bay doors. The infected turn toward the noise. You escape scraped and exhausted, with a few rounds from the security desk.'},
shoot:()=>{if(g.ammo>0){g.ammo--;g.health-=8;g.meds++;g.flags.sister=true;return 'The shot echoes through the building. You make it to the pharmacy and find your sister—hurt, but alive. The noise brings more infected.'}g.health-=25;return 'Your weapon clicks empty. You flee through a side door, bitten and bleeding.'},
shelter:()=>{g.food++;g.water++;g.energy+=10;return 'You reinforce the apartment and gather what you can. It buys you one quiet night, not a future.'},
rest:()=>{g.energy=Math.min(100,g.energy+28);g.hunger+=10;g.morale+=4;return 'You sleep in short, uneasy stretches. Your body feels steadier, though your stomach is empty.'},
scavenge:()=>{g.food+=2;g.water++;if(Math.random()<.45)g.meds++;g.health-=Math.random()<.3?8:0;return 'You find canned food, bottled water, and a small first aid kit. Something moved in the stairwell while you were searching.'},
radio:()=>{g.flags.radio=true;g.morale+=6;return 'A scratchy voice repeats coordinates for a ranger station in Pine Ridge. It sounds like a real place. You mark it on a paper map.'},
family:()=>{g.people+=2;g.food--;g.energy-=15;g.morale+=12;g.flags.family=true;return 'You get the family off the bus. There are three of them, and they share their last can of peaches with you.'},
cars:()=>{g.food++;g.ammo++;g.energy-=8;return 'You find a half-full water bottle, a box of shells, and a map to an old ranger station.'},
woods:()=>{g.health-=8;g.energy-=12;g.flags.woods=true;return 'Briars tear your sleeves and the forest is hard to navigate. But you avoid the worst of the highway and find a ranger station.'},
mast:()=>{if(g.flags.radio){g.flags.signal=true;g.morale+=18;return 'You climb the tower and splice the wire. A voice answers through the static: a relief convoy is three days away. They can take everyone.'}g.energy-=18;g.morale+=6;return 'You get the mast powered, but the antenna is damaged. You need a radio frequency to make contact.'},
garden:()=>{g.food+=2;g.morale+=8;g.flags.garden=true;return 'You spend the day clearing weeds and planting seeds. It is a small start, but the camp has something to look forward to.'},
scout:()=>{g.energy-=12;g.flags.scouted=true;g.ammo++;return 'You find a ridge path to the river, and a box of old flares. From above, you can see the camp is surrounded—but not yet found.'},
sister:()=>{if(g.meds>0){g.meds--;g.flags.sister=true;g.people++;g.morale+=18;return 'You use your last medicine to treat your sister. She is weak, but she can walk. She squeezes your hand: “We’ll make it.”'}g.health-=10;g.people++;g.flags.sister=true;return 'You have no medicine. You clean and bind the wound as best you can. She joins you, pale but determined.'},
escape:()=>{g.health-=6;g.flags.sister=true;g.people++;return 'You pull your sister through the service exit and into the dawn. She is with you.'}
};
function render(){
const scene=scenes[g.place]||scenes.camp;
$('#app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand">AFTER<span>LIGHT</span><small>A SURVIVAL STORY</small></div><div class="top-actions"><button class="iconbtn" id="save">↗ Save</button><button class="iconbtn" id="restart">↻ New story</button></div></header>
<div class="layout"><aside class="side"><section class="card survivor"><div class="eyebrow">Survivor profile</div><div class="name-line"><div class="name">${esc(g.name||'Survivor')}</div><div class="badge">Day ${g.day}</div></div>${stat('Health',g.health,'health')}${stat('Energy',g.energy,'energy')}${stat('Morale',g.morale,'morale')}${stat('Hunger',100-g.hunger,'')}</section>
<section class="card"><div class="eyebrow" style="margin-bottom:12px">Pack & supplies</div><div class="inventory">${item('Food',g.food,'🥫')}${item('Water',g.water,'💧')}${item('Medicine',g.meds,'✚')}${item('Ammo',g.ammo,'▸')}${item('Companions',g.people,'♙')}</div></section>
<section class="card"><div class="eyebrow">Field notes</div><div class="log">${g.log.slice(0,5).map(x=>'<div class="logline">◦ <strong>'+esc(x)+'</strong></div>').join('')||'<div class="logline">Your story is just beginning.</div>'}</div></section></aside>
<main class="main"><section class="hero"><div class="kicker">DAY ${g.day} &nbsp;·&nbsp; ${scene.place}</div><h1>${scene.title}</h1><p>${scene.text()}</p></section>
<section class="card"><div class="eyebrow">What will you do?</div><p class="narrative">${g.day===1?'Every choice costs something. Keep yourself alive, and decide what kind of person you want to be.':'The hours pass. The world keeps asking what you’re willing to risk.'}</p><div class="choices">${scene.choices.map(([icon,title,desc,key])=>'<button class="choice" data-choice="'+key+'"><span class="choice-icon">'+icon+'</span><span class="choice-copy"><b>'+title+'</b><small>'+desc+'</small></span><span class="choice-arrow">›</span></button>').join('')}</div></section>
<div class="footer"><span>NO TWO STORIES END THE SAME</span><span>DAY ${g.day} / ?</span></div></main></div></div>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));$('#restart').onclick=confirmRestart;$('#save').onclick=saveGame;
}
function stat(label,value,cls){value=Math.max(0,Math.min(100,value));return '<div class="stat"><div class="stat-head"><span>'+label+'</span><b>'+Math.round(value)+'%</b></div><div class="track"><div class="fill '+cls+'" style="width:'+value+'%"></div></div></div>'}
function item(label,n,icon){return '<div class="item"><span>'+icon+' '+label+'</span><b>'+n+'</b></div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(key){
if(['clinic','shelter','highway'].includes(key)){g.place=key;render();return}
const fn=events[key];if(!fn)return;const message=fn();g.log.unshift('Day '+g.day+': '+message);g.log=g.log.slice(0,20);
g.hunger+=9;g.energy-=4;g.day++;
if(g.hunger>=75){g.health-=8;g.log.unshift('Hunger is catching up with you.');}
if(g.food>0&&Math.random()<.35){g.food--;g.hunger=Math.max(0,g.hunger-15)}
if(g.water>0&&Math.random()<.5){g.water--;g.health=Math.min(100,g.health+2)}
if(key==='rescue'||key==='distract'||key==='shoot')g.place=(g.flags.sister?'clinic2':'camp');
else if(['shelter','rest','scavenge','radio'].includes(key))g.place='camp';
else if(['family','cars','woods'].includes(key))g.place='camp';
else if(['mast','garden','scout'].includes(key)){if(g.flags.signal){endGame('signal')}else g.place='camp';}
else if(['sister','escape'].includes(key)){g.place='camp'}
if(g.health<=0){endGame('lost');return}
if(g.day>9&&!g.flags.signal){endGame('endure');return}
render();
}
function endGame(type){
let title,body,tag;
if(type==='signal'){title='A light on the horizon.';body='On the third morning, the convoy crests the ridge. The people you gathered stand beside you as the trucks roll into the valley. This is not the end of the world. It is a chance to begin again.';tag='THE SIGNAL';}
else if(type==='lost'){title='The story goes quiet.';body='The cold and hunger finally catch up with you. The people you helped carry your name forward, and keep moving. Somewhere, another light is still on.';tag='LOST TO THE OUTBREAK';}
else{title='Another day, another dawn.';body='The convoy never came, but your camp holds. You have food, people who know your name, and a plan for tomorrow. For now, that is enough.';tag='STILL HERE';}
$('#app').insertAdjacentHTML('beforeend','<div class="overlay"><div class="modal"><div class="eyebrow">Your story · Day '+(g.day-1)+'</div><h1>'+title+'</h1><div class="endtag">'+tag+'</div><p class="intro">'+body+'</p><p>Survived '+(g.day-1)+' days · '+g.people+' companions · '+g.food+' food remaining</p><div class="row"><button class="primary" id="again">Begin again</button><button class="quiet" id="keep">Read your story</button></div></div></div>');
$('#again').onclick=()=>showStart();$('#keep').onclick=()=>{$('.overlay').remove();render();}
}
function confirmRestart(){if(confirm('Start a new story? Your current story will be replaced.'))showStart()}
function saveGame(){try{localStorage.setItem('afterlight-save',JSON.stringify(g));alert('Story saved on this device.')}catch(e){alert('Could not save this story.')}}
function loadGame(){try{const x=JSON.parse(localStorage.getItem('afterlight-save'));if(x&&x.day)g=x}catch(e){}}
function showStart(){
$('#app').innerHTML='<div class="overlay"><div class="modal"><div class="brand">AFTER<span>LIGHT</span><small>A SURVIVAL STORY</small></div><div style="height:20px"></div><div class="eyebrow">A choice-driven survival game</div><h1>The world ended.<br>What will you do?</h1><p class="intro">A zombie outbreak has torn through the city. Your sister is missing. Food is scarce. Every decision changes what happens next—and who makes it through with you.</p><div class="field"><label for="player">Your name</label><input id="player" maxlength="22" placeholder="What should we call you?" value="'+esc(g.name)+'"></div><div class="row"><button class="primary" id="start">Start your story →</button><button class="quiet" id="continue">Continue saved story</button></div><p style="font-size:11px;margin:17px 0 0;color:#788075">One decision at a time. There are no perfect choices.</p></div></div>';
$('#start').onclick=()=>{let n=$('#player').value.trim();g={...defaults,name:n||'Alex',flags:{},log:[],ended:false};g.place='start';render();};
$('#continue').onclick=()=>{loadGame();g.place=g.place||'start';render()};
}
g.place='start';showStart();
</script></body></html>
