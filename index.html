<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFTERLIGHT — A Survival Story</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap');
:root{--bg:#101310;--panel:#171b17;--line:#30372f;--muted:#9da59a;--cream:#eee9dc;--lime:#c4ed75;--rust:#e18463;--blue:#89b7d7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#2c382c 0%,#171b17 45%,#101310 85%);color:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}.shell{max-width:1160px;margin:auto;padding:20px 24px 42px}
.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0 18px;margin-bottom:24px}.brand{font:700 23px Oswald;letter-spacing:3px}.brand span{color:var(--lime)}.brand small{display:block;color:var(--muted);font:10px 'DM Mono';letter-spacing:2px;margin-top:1px}.top-actions{display:flex;gap:10px}.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--muted);font-size:12px}.iconbtn:hover{border-color:var(--lime);color:var(--cream)}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px}.side{display:flex;flex-direction:column;gap:14px}.card{background:linear-gradient(145deg,#1a201a,#151915);border:1px solid var(--line);border-radius:12px;padding:18px}.survivor{padding:20px}.eyebrow{font:11px 'DM Mono';letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font:600 clamp(27px,4vw,42px) Oswald;text-transform:uppercase;letter-spacing:.5px;line-height:1.08;margin:9px 0 8px}h2{font:600 20px Oswald;text-transform:uppercase;margin-bottom:13px}h3{font:600 14px 'DM Sans';margin:0 0 12px}.name-line{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.name{font-size:18px;font-weight:700}.badge{font:10px 'DM Mono';padding:5px 7px;border:1px solid #414941;border-radius:99px;color:var(--lime);text-transform:uppercase}
.stat{margin:13px 0}.stat-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.stat-head b{font:12px 'DM Mono';font-weight:400;color:var(--cream)}.track{height:6px;background:#30372f;border-radius:9px;overflow:hidden}.fill{height:100%;border-radius:9px;transition:width .35s;background:var(--lime)}.fill.health{background:var(--rust)}.fill.energy{background:#e7bd6a}.fill.morale{background:#89b7d7}
.inventory{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:1px solid var(--line);background:#121612;border-radius:8px;padding:10px}.item span{display:block;font:10px 'DM Mono';color:var(--muted);text-transform:uppercase}.item b{display:block;margin-top:4px;font:15px 'DM Mono';color:var(--cream)}
.main{min-width:0}.hero{position:relative;overflow:hidden;min-height:190px;border-radius:13px;border:1px solid #3c4638;background:linear-gradient(105deg,rgba(16,19,16,.97),rgba(16,19,16,.72)),radial-gradient(ellipse at 80% 45%,#536342 0,#303c2a 28%,#191e18 58%);padding:24px 27px;margin-bottom:16px}.hero:after{content:'☣';position:absolute;font-size:180px;line-height:1;right:28px;top:4px;color:#c4ed75;opacity:.075}.hero>*{position:relative;z-index:1}.kicker{font:11px 'DM Mono';letter-spacing:2px;color:var(--lime)}.hero p{color:#c2c7bd;max-width:550px;line-height:1.65;margin:12px 0 0;font-size:14px}
.narrative{line-height:1.75;color:#d1d4cb;font-size:15px;margin:0 0 19px}.choices{display:grid;gap:9px}.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:10px;background:#181d18;transition:.17s}.choice:hover{transform:translateY(-1px);border-color:#81965d;background:#20271e}.choice:disabled{opacity:.45;cursor:not-allowed}.choice-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:8px;background:#283026;color:var(--lime);font-size:16px}.choice-copy{flex:1}.choice-copy b{display:block;font-size:14px;margin-bottom:4px}.choice-copy small{color:var(--muted);font-size:12px;line-height:1.45;display:block}.choice-arrow{color:#798276;font-size:19px}.log{margin-top:15px;max-height:150px;overflow:auto}.logline{border-top:1px solid #272d27;padding:8px 0;font-size:11px;color:var(--muted);line-height:1.4}.logline strong{color:#d6dbd0;font-weight:500}
.footer{display:flex;justify-content:space-between;align-items:center;color:#727b70;font:10px 'DM Mono';margin-top:18px}
.overlay{position:fixed;inset:0;z-index:10;background:rgba(8,10,8,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}.modal{width:min(520px,100%);background:#171c17;border:1px solid #3a4437;border-radius:15px;padding:30px;box-shadow:0 24px 100px #0009}.modal h1{font-size:40px}.modal p{color:#b9c0b5;line-height:1.65}.modal .intro{font-size:15px}.field{display:flex;flex-direction:column;gap:7px;margin:20px 0}.field label{font:10px 'DM Mono';letter-spacing:1px;color:var(--muted);text-transform:uppercase}.field input{background:#101410;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--cream);font:15px 'DM Sans';outline:none}.field input:focus{border-color:var(--lime)}
.primary{border:0;border-radius:8px;padding:12px 17px;background:var(--lime);color:#151a12;font-weight:700}.primary:hover{background:#d6f696}.quiet{border:1px solid var(--line);border-radius:8px;padding:12px 17px;background:none}.row{display:flex;gap:10px;flex-wrap:wrap}.endtag{display:inline-block;border:1px solid #58674a;color:var(--lime);padding:6px 9px;border-radius:5px;font:10px 'DM Mono';letter-spacing:1px;margin:4px 0 15px}
@media(max-width:760px){.shell{padding:14px 14px 30px}.layout{grid-template-columns:1fr;gap:14px}.side{display:grid;grid-template-columns:1fr 1fr;align-items:start}.survivor{grid-column:1/-1}.card{padding:15px}.hero{padding:21px;min-height:180px}.hero:after{right:0;font-size:140px}.topbar{margin-bottom:15px}}
@media(max-width:400px){.side{grid-template-columns:1fr}.survivor{grid-column:auto}.choice{padding:12px}.hero p{font-size:13px}}
</style>
</head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const defaults={day:1,name:'',health:76,energy:78,morale:62,hunger:28,water:24,ammo:3,food:2,meds:1,people:0,flags:{},log:[],ended:false,ending:''};
let g={...defaults};
const pick=list=>list[Math.floor(Math.random()*list.length)];
const makeStory=()=>{const type=pick(['missing','medicine','broadcast','convoy']);const shared={type,district:pick(['Riverside','Old Town','the Warehouse District','Northgate','the university quarter']),outbreak:pick(['a hospital evacuation that collapsed','a highway pileup that sealed the bridges','a blackout that shut down the whole district','a storm that trapped people indoors','a crowded shelter that went silent']),weather:pick(['cold rain','a heavy fog','dry wind carrying ash','a sudden spring downpour','an unnaturally warm night']),firstEvent:pick(['A car alarm starts screaming down the block.','Someone pounds on a door across the street, then goes quiet.','The power flickers out across the neighborhood.','A helicopter circles once and disappears beyond the rooftops.','A dog runs through the street with a torn leash dragging behind it.']),camp:pick(['Pine Ridge','Juniper Hollow','Cedar Pass','Greywater Station'])};if(type==='missing'){const person=pick(['sister','brother','partner','best friend','mother','son']);return {...shared,person,target:'COUNTY CLINIC',opening:()=>`Your ${person} sent one last message: “I’m at the county clinic. Please come.”`}}if(type==='medicine')return {...shared,target:pick(['WESTSIDE PHARMACY','ST MARY’S URGENT CARE','THE OLD FIELD HOSPITAL']),opening:()=>`A medic on the emergency channel says a case of antibiotics is still at ${shared.target}. The nearest camp is running out.`};if(type==='broadcast')return {...shared,target:pick(['NORTHGATE RADIO TOWER','CHANNEL 8 TRANSMITTER','THE RIVERSIDE RELAY']),opening:()=>`A voice breaks through the static with one request: reach ${shared.target} and get the emergency broadcast back online.`};return {...shared,target:pick(['THE RIVER BRIDGE','MILE 18 CHECKPOINT','THE EASTBOUND OVERPASS']),opening:()=>`An evacuation convoy is pinned down at ${shared.target}. They are asking anyone who can walk to help clear a way through.`}};
function campChoices(){const rest=['🛏','Rest and recover','Regain energy, but spend another day.','rest'];const radio=['📻','Tune the radio','Search for a safe camp and rescue channel.','radio'];const scout=['🧭','Scout the route','Find a safer path and see what is nearby.','scout'];let choices;const s=g.story||{};if(s.type==='missing'&&!g.flags.contactFound)choices=[['🔎',`Look for your ${s.person}`,'Search the clinic before the trail goes cold.','findContact'],radio,rest];else if(s.type==='missing')choices=[g.flags.radio?['📡','Call the rescue convoy','Use the coordinates you found to signal for help.','mast']:radio,scout,['🌱','Help the camp','Build food and lift everyone’s spirits.','garden']];else if(s.type==='medicine'&&!g.flags.medicine)choices=[['💊','Search for antibiotics','The camp’s supply is running out.','searchMedicine'],radio,rest];else if(s.type==='medicine')choices=[['📦','Deliver the medicine','Get the antibiotics to the sick survivors.','deliverMedicine'],scout,rest];else if(s.type==='broadcast')choices=g.flags.radio?[['📡','Repair the relay','Restore the emergency broadcast.','mast'],scout,rest]:[radio,scout,rest];else if(g.flags.family)choices=[['🚧','Guide the convoy through','Lead the rescued people along the path you scouted.','scout'],radio,rest];else choices=[scout,['🤝','Gather more survivors','Find people who can help clear the checkpoint.','family'],rest];if(g.lastCampChoice){const fresh=choices.filter(choice=>choice[3]!==g.lastCampChoice);if(fresh.length<3){const extras=[radio,scout,rest,['🌱','Help the camp','Build food and lift everyone’s spirits.','garden']].filter(choice=>choice[3]!==g.lastCampChoice&&!fresh.some(item=>item[3]===choice[3]));fresh.push(...extras)}choices=fresh.slice(0,3)}return choices}
const scenes={
start:{place:()=>g.story?.district.toUpperCase()||'YOUR NEIGHBORHOOD',title:()=>g.story?.type==='missing'?'Someone is waiting.':g.story?.type==='medicine'?'A chance to save lives.':g.story?.type==='broadcast'?'The last voice on the radio.':'People are trapped.',text:()=>`The emergency broadcast cut out before dawn. ${g.story?.firstEvent||'The city has gone silent.'} The outbreak began after ${g.story?.outbreak||'the city fell into chaos'}. ${g.story?.opening?.()||'The streets are changing fast.'} ${g.story?.district||'Riverside'} is already overrun.`,choices:()=>{const s=g.story||{};if(s.type==='missing')return [['🏃','Go to the clinic',`Find your ${s.person}. The roads will be dangerous.`,'clinic'],['🏠','Secure the apartment','Gather supplies before you move.','shelter'],['🚗','Take the highway','Try to reach the clinic from the north.','highway']];if(s.type==='medicine')return [['🏥','Reach the pharmacy','Look for medicine before it is too late.','clinic'],['🏠','Secure the apartment','Gather supplies for the trip.','shelter'],['🚗','Search the highway','Look for a faster route to the pharmacy.','highway']];if(s.type==='broadcast')return [['📡','Reach the relay station','Get the emergency broadcast back online.','clinic'],['🏠','Set up a radio','Find equipment and tune in from shelter.','shelter'],['🚗','Take the highway','Look for a route to the transmitter.','highway']];return [['🚧','Head for the checkpoint','Help the convoy break through.','clinic'],['🏠','Gather supplies','Prepare for the dangerous trip.','shelter'],['🚗','Take the highway','Reach the convoy by road.','highway']]}},
1:{place:'THE FIRST MORNING',title:'The world went quiet.',text:()=>scenes.start.text(),choices:[
['🏃','Go to the clinic','Find your sister. The roads will be dangerous.','clinic',{}],
['🏠','Secure the apartment','Board the doors and gather what you can.','shelter',{}],
['🚗','Leave the city','The highway may still be open. Your sister will have to wait.','highway',{}]]},
clinic:{place:()=>g.story?.target||'COUNTY CLINIC',title:'A long way through.',text:()=>g.story?.type==='broadcast'?`The service door at ${g.story.target} hangs open. A technician is sheltering beside the controls while infected scrape at the stairwell door.`:g.story?.type==='convoy'?`The barricade at ${g.story?.target} is buckling. A stranded driver waves from behind an overturned truck as infected gather in the road.`:`The entrance to ${g.story?.target||'the county clinic'} is stuck half open. Something drags its feet inside. A nurse crouches behind the reception desk, clutching a ring of keys.`,choices:[
['🗝','Help the nurse','Get her out. Two people have a better chance.','rescue',{}],
['🧱','Make a distraction','Draw the infected toward the ambulance bay.','distract',{}],
['🔫','Spend a round','Clear the lobby quickly.','shoot',{}]]},
shelter:{place:'YOUR APARTMENT',title:'The first night.',text:()=>`You wedge a table against the front door. ${g.story?.firstEvent||'The city groans outside.'} ${g.story?.weather||'Rain'} blurs the windows. You have a few hours before you need to move.`,choices:[
['🥫','Ration and rest','Recover your strength and make supplies last.','rest',{}],
['🔍','Search nearby apartments','Risk the halls for food and medicine.','scavenge',{}],
['📻','Check the radio','Listen for a safe zone or another survivor.','radio',{}]]},
highway:{place:'NORTHBOUND HIGHWAY',title:'The road out.',text:()=>`Cars are abandoned across all lanes. A family waves from an overturned bus. Beyond them, the road disappears into a wall of smoke.`,choices:[
['🤝','Help the family','Take a risk for people who need you.','family',{}],
['⛽','Search the cars','Look for fuel and supplies before moving on.','cars',{}],
['🌲','Cut through the woods','Avoid the highway and keep moving.','woods',{}]]},
camp:{place:()=>g.story?.camp||'PINE RIDGE CAMP',title:()=>g.day===2?'The next move is yours.':'A fragile refuge.',text:()=>`You reach an old ranger station tucked into the hills. A handful of survivors have made a camp here. ${g.story?.threat?`Your last scouting trip spotted ${g.story.threat}.`:pick(['The generator coughs but keeps running.','Rain drums on the old roof.','A few survivors argue quietly near the radio mast.','Someone has started clearing a patch for a garden.'])} ${g.lastOutcome?`Your last decision: ${g.lastOutcome}`:'There is a radio mast, a garden, and a lot of nervous eyes.'}`,choices:campChoices},
clinic2:{place:()=>g.story?.target||'COUNTY CLINIC',title:'Someone is still here.',text:()=>`You spot a familiar blue coat near the pharmacy. Your ${g.story?.person||'sister'} made it this far. They are hurt, but alive. Outside, ${g.story?.weather||'rain'} taps at the boarded windows.`,choices:[
['🩹','Treat their wound','Use your medicine and get them somewhere safe.','sister',{}],
['🚪','Get out now','The noise is drawing infected from every hall.','escape',{}]]},
};
const events={
rescue:()=>{const helper=pick(['Mara','Dev','Ruth','Jules','Nico']);g.people++;g.morale+=13;g.meds++;g.flags.nurse=helper;return `${helper} grabs your hand. “There’s a way out. I know the way.” You slip to safety together, with medicine and a new companion.`},
findContact:()=>{g.flags.contactFound=true;return `You find your ${g.story?.person||'sister'} sheltering in the clinic pharmacy. They are injured, but alive.`},
searchMedicine:()=>{g.flags.medicine=true;g.meds+=2;return 'You find a sealed antibiotic case in a nearby dispensary. It is exactly what the camp needs.'},
deliverMedicine:()=>{g.people++;g.flags.medicineDelivered=true;return `You deliver the antibiotics to the camp medic at ${g.story?.camp||'the ranger station'}. The sick survivors finally have a chance to recover.`},
distract:()=>{g.energy-=14;g.health-=5;if(Math.random()<.6)g.ammo++;return pick(['You bang on the ambulance bay doors. The infected turn toward the noise. You escape scraped and exhausted.','You trigger the fire alarm and slip through the service hall while the lobby empties.','You toss a metal tray down the corridor. The distraction works, but the sprint leaves you winded.'])+(g.ammo>3?' A guard dropped a few rounds.':'')},
shoot:()=>{if(g.ammo>0){g.ammo--;g.health-=8;if(g.story?.type==='missing'){g.meds++;g.flags.contactFound=true;return `The shot echoes through the building. You find your ${g.story.person} hurt but alive in the pharmacy. The noise brings more infected.`}if(g.story?.type==='medicine'){g.meds+=2;g.flags.medicine=true;return 'You reach the pharmacy and recover the antibiotics the camp needs. The shot draws infected from the surrounding streets.'}g.meds++;return pick(['You clear a path through the lobby and reach a radio console. The shot draws infected from nearby.','You find a working hand radio in the security office, but the noise draws a crowd.'])}g.health-=25;return 'Your weapon clicks empty. You flee through a side door, bitten and bleeding.'},
shelter:()=>{g.food++;g.water++;g.energy+=10;return 'You reinforce the apartment and gather what you can. It buys you one quiet night, not a future.'},
rest:()=>{g.energy=Math.min(100,g.energy+28);g.hunger+=10;g.morale+=4;return 'You sleep in short, uneasy stretches. Your body feels steadier, though your stomach is empty.'},
scavenge:()=>{let finds=pick(['a crate of canned soup','a backpack with dry food','sealed bottles beneath a sink','a first aid kit and a few cans']);g.food+=Math.random()<.7?2:1;g.water++;if(Math.random()<.45)g.meds++;const danger=Math.random()<.28;if(danger)g.health-=8;return `You search the empty apartments and find ${finds}. ${danger?'A loose stair gives way beneath you, leaving a painful bruise.':'You hear movement nearby, but make it back unseen.'}`},
radio:()=>{g.flags.radio=true;g.morale+=6;g.story.radioVoice=pick(['a volunteer dispatcher','a park ranger','a child reading coordinates','a calm voice using an old call sign']);g.story.camp=pick(['Pine Ridge','Juniper Hollow','Cedar Pass','Greywater Station']);return `${g.story.radioVoice} repeats coordinates for ${g.story.camp}, an old ranger station. It sounds like a real place. You mark it on a paper map.`},
family:()=>{g.people+=2;g.food--;g.energy-=15;g.morale+=12;g.flags.family=true;return 'You get the family off the bus. There are three of them, and they share their last can of peaches with you.'},
cars:()=>{g.food++;g.ammo++;g.energy-=8;return 'You find a half-full water bottle, a box of shells, and a map to an old ranger station.'},
woods:()=>{g.health-=8;g.energy-=12;g.flags.woods=true;return 'Briars tear your sleeves and the forest is hard to navigate. But you avoid the worst of the highway and find a ranger station.'},
mast:()=>{if(g.flags.radio||g.story?.type==='broadcast'){g.flags.signal=true;g.morale+=18;return `You climb the tower and splice the wire. A voice answers through the static. ${g.story?.type==='broadcast'?'The emergency broadcast is back on the air; people across the region can hear the safe-route message.':'A relief convoy is three days away. They can take everyone.'}`}g.energy-=18;g.morale+=6;return 'You get the mast powered, but the antenna is damaged. You need a radio frequency to make contact.'},
garden:()=>{g.food+=2;g.morale+=8;g.flags.garden=true;return 'You spend the day clearing weeds and planting seeds. It is a small start, but the camp has something to look forward to.'},
scout:()=>{g.energy-=12;g.flags.scouted=true;if(Math.random()<.65)g.ammo++;g.story.threat=pick(['a pack of infected moving in the valley','a smoke plume rising east of camp','fresh tire tracks on the ridge','a quiet trail leading down to the river']);return `You find a ridge path. From above, you spot ${g.story.threat}. ${g.ammo>3?'A box of flares is tucked under a fallen sign.':'You return with a clearer map of the area.'}`},
sister:()=>{const person=g.story?.person||'sister';if(g.meds>0){g.meds--;g.flags.sister=true;g.people++;g.morale+=18;return `You use your medicine to treat your ${person}. They are weak, but can walk. “We’ll make it,” they promise.`}g.health-=10;g.people++;g.flags.sister=true;return `You have no medicine. You clean and bind your ${person}’s wound as best you can. They join you, pale but determined.`},
escape:()=>{g.health-=6;g.flags.sister=true;g.people++;return `You pull your ${g.story?.person||'sister'} through the service exit and into the dawn. They are with you.`}
};
function rollEncounter(){
const roll=Math.random();
if(roll<.22){const found=pick(['a forgotten cache of canned food','a clean bottle of water','a few useful bandages','a box of old ammunition']);if(found.includes('food'))g.food++;else if(found.includes('water'))g.water++;else if(found.includes('bandages'))g.meds++;else g.ammo++;return `Along the way: ${found} was tucked beneath the floorboards.`}
if(roll<.42){g.morale+=pick([3,5,7]);return `Along the way: ${pick(['a stranger leaves a candle in the window','you hear music from a battery radio','someone has painted “KEEP GOING” on a wall'])}. The small kindness steadies you.`}
if(roll<.65){const loss=pick(['energy','health']);g[loss]-=loss==='health'?5:8;return `Along the way: ${pick(['a distant scream sends you running','rain turns the road into slick mud','a sudden crash draws infected to your route'])}. You lose some ${loss}.`}
return `Along the way: ${pick(['you find an empty bus with its doors wide open','the wind carries ash across the road','a flock of birds lifts from the rooftops'])}. Nothing follows you this time.`
}
function render(){
const scene=scenes[g.place]||scenes.camp;
$('#app').innerHTML=`<div class="shell"><header class="topbar"><div class="brand">AFTER<span>LIGHT</span><small>A SURVIVAL STORY</small></div><div class="top-actions"><button class="iconbtn" id="save">↗ Save</button><button class="iconbtn" id="restart">↻ Restart storyline</button></div></header>
<div class="layout"><aside class="side"><section class="card survivor"><div class="eyebrow">Survivor profile</div><div class="name-line"><div class="name">${esc(g.name||'Survivor')}</div><div class="badge">Day ${g.day}</div></div>${stat('Health',g.health,'health')}${stat('Energy',g.energy,'energy')}${stat('Morale',g.morale,'morale')}${stat('Hunger',100-g.hunger,'')}</section>
<section class="card"><div class="eyebrow" style="margin-bottom:12px">Pack & supplies</div><div class="inventory">${item('Food',g.food,'🥫')}${item('Water',g.water,'💧')}${item('Medicine',g.meds,'✚')}${item('Ammo',g.ammo,'▸')}${item('Companions',g.people,'♙')}</div></section>
<section class="card"><div class="eyebrow">Field notes</div><div class="log">${g.log.slice(0,5).map(x=>'<div class="logline">◦ <strong>'+esc(x)+'</strong></div>').join('')||'<div class="logline">Your story is just beginning.</div>'}</div></section></aside>
<main class="main"><section class="hero"><div class="kicker">DAY ${g.day} &nbsp;·&nbsp; ${typeof scene.place==='function'?scene.place():scene.place}</div><h1>${typeof scene.title==='function'?scene.title():scene.title}</h1><p>${scene.text()}</p></section>
<section class="card"><div class="eyebrow">What will you do?</div><p class="narrative">${g.day===1?'Every choice costs something. Keep yourself alive, and decide what kind of person you want to be.':'The hours pass. The world keeps asking what you’re willing to risk.'}</p><div class="choices">${(typeof scene.choices==='function'?scene.choices():scene.choices).map(([icon,title,desc,key])=>'<button class="choice" data-choice="'+key+'"><span class="choice-icon">'+icon+'</span><span class="choice-copy"><b>'+title+'</b><small>'+desc+'</small></span><span class="choice-arrow">›</span></button>').join('')}</div></section>
<div class="footer"><span>NO TWO STORIES END THE SAME</span><span>DAY ${g.day} / ?</span></div></main></div></div>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));$('#restart').onclick=confirmRestart;$('#save').onclick=saveGame;
}
function stat(label,value,cls){value=Math.max(0,Math.min(100,value));return '<div class="stat"><div class="stat-head"><span>'+label+'</span><b>'+Math.round(value)+'%</b></div><div class="track"><div class="fill '+cls+'" style="width:'+value+'%"></div></div></div>'}
function item(label,n,icon){return '<div class="item"><span>'+icon+' '+label+'</span><b>'+n+'</b></div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(key){
if(['clinic','shelter','highway'].includes(key)){g.place=key;render();return}
const fn=events[key];if(!fn)return;const fromCamp=g.place==='camp';const message=fn();if(fromCamp)g.lastCampChoice=key;g.lastOutcome=message;g.log.unshift('Day '+g.day+': '+message);g.log.unshift(rollEncounter());g.log=g.log.slice(0,20);
g.hunger+=9;g.energy-=4;g.day++;
if(g.hunger>=75){g.health-=8;g.log.unshift('Hunger is catching up with you.');}
if(g.food>0&&Math.random()<.35){g.food--;g.hunger=Math.max(0,g.hunger-15)}
if(g.water>0&&Math.random()<.5){g.water--;g.health=Math.min(100,g.health+2)}
if(key==='findContact')g.place='clinic2';
else if(key==='rescue'||key==='distract'||key==='shoot')g.place=(g.flags.contactFound?'clinic2':'camp');
else if(['shelter','rest','scavenge','radio'].includes(key))g.place='camp';
else if(['family','cars','woods'].includes(key))g.place='camp';
else if(['mast','garden','scout'].includes(key)){if(g.flags.signal){endGame('signal')}else g.place='camp';}
else if(['sister','escape'].includes(key)){g.place='camp'}
if(g.health<=0){endGame('lost');return}
if(g.story?.type==='medicine'&&key==='deliverMedicine'){endGame('medicine');return}
if(g.story?.type==='convoy'&&key==='scout'){endGame('convoy');return}
if(g.day>9&&!g.flags.signal){endGame('endure');return}
render();
}
function endGame(type){
let title,body,tag;
if(type==='signal'){title='A light on the horizon.';body=g.story?.type==='broadcast'?'Your message crackles out over the region. In the hours that follow, lights appear across the map as isolated survivors answer. You gave them a way to find one another.':'On the third morning, the convoy crests the ridge. The people you gathered stand beside you as the trucks roll into the valley. This is not the end of the world. It is a chance to begin again.';tag=g.story?.type==='broadcast'?'THE AIRWAVES ARE ALIVE':'THE SIGNAL';}
else if(type==='medicine'){title='The camp makes it through.';body=`The antibiotics reach ${g.story?.camp||'the camp'} just in time. The fever breaks, and the people you helped have a real chance to recover.`;tag='A LIFE SAVED';}
else if(type==='convoy'){title='The road opens.';body=`You guide the convoy through ${g.story?.target||'the checkpoint'} and out of the city. Strangers become a community as the sun rises behind you.`;tag='THE WAY THROUGH';}
else if(type==='lost'){title='The story goes quiet.';body='The cold and hunger finally catch up with you. The people you helped carry your name forward, and keep moving. Somewhere, another light is still on.';tag='LOST TO THE OUTBREAK';}
else{title='Another day, another dawn.';body='The convoy never came, but your camp holds. You have food, people who know your name, and a plan for tomorrow. For now, that is enough.';tag='STILL HERE';}
$('#app').insertAdjacentHTML('beforeend','<div class="overlay"><div class="modal"><div class="eyebrow">Your story · Day '+(g.day-1)+'</div><h1>'+title+'</h1><div class="endtag">'+tag+'</div><p class="intro">'+body+'</p><p>Survived '+(g.day-1)+' days · '+g.people+' companions · '+g.food+' food remaining</p><div class="row"><button class="primary" id="again">Begin again</button><button class="quiet" id="keep">Read your story</button></div></div></div>');
$('#again').onclick=()=>startNewStory(g.name);$('#keep').onclick=()=>{$('.overlay').remove();render();}
}
function startNewStory(name){g={...defaults,name:name||'Alex',story:makeStory(),health:pick([62,68,76,82,90]),energy:pick([60,70,78,86,94]),morale:pick([42,54,62,74,86]),food:pick([1,2,2,3]),water:pick([1,2,3]),ammo:pick([1,2,3,4]),meds:pick([0,1,1,2]),hunger:pick([18,24,28,36]),flags:{},log:[],ended:false};g.place='start';render()}
function confirmRestart(){if(confirm('Restart with a completely new randomized storyline? Your current run will be replaced.'))startNewStory(g.name)}
function saveGame(){try{localStorage.setItem('afterlight-save',JSON.stringify(g));alert('Story saved on this device.')}catch(e){alert('Could not save this story.')}}
function loadGame(){try{const x=JSON.parse(localStorage.getItem('afterlight-save'));if(x&&x.day){g=x;if(!g.story)g.story=makeStory()}}catch(e){}}
function showStart(){
$('#app').innerHTML='<div class="overlay"><div class="modal"><div class="brand">AFTER<span>LIGHT</span><small>A SURVIVAL STORY</small></div><div style="height:20px"></div><div class="eyebrow">A choice-driven survival game</div><h1>The world ended.<br>What will you do?</h1><p class="intro">Every new run draws a different goal, location, outbreak, starting supplies and survival hazards. Find someone, recover medicine, restore a broadcast, or help a convoy escape. Your choices shape the ending.</p><div class="field"><label for="player">Your name</label><input id="player" maxlength="22" placeholder="What should we call you?" value="'+esc(g.name)+'"></div><div class="row"><button class="primary" id="start">Start your story →</button><button class="quiet" id="continue">Continue saved story</button></div><p style="font-size:11px;margin:17px 0 0;color:#788075">One decision at a time. There are no perfect choices.</p></div></div>';
$('#start').onclick=()=>startNewStory($('#player').value.trim());
$('#continue').onclick=()=>{loadGame();g.place=g.place||'start';render()};
}
g.place='start';showStart();
</script></body></html>
